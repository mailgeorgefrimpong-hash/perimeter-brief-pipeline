# Perimeter Brief — source catalog
#
# Every source here has a real, verified endpoint (checked live before being added —
# see the `checked` date on each). Nothing here is scraped by guesswork or by an LLM
# deciding what to search for: each `type` maps to one deterministic fetcher in
# scraper/fetchers.py that hits a known API/feed and pulls fixed fields.
#
# `active: false` sources are ones that failed a direct check (blocked, wrong shape,
# needs auth) and are kept here as documented TODOs rather than silently dropped or
# guessed at — matching the brief's own "never fabricate a source" rule. The daily
# run logs every active source it successfully reached vs. one that errored, same
# shape as the existing Ops dashboard's sources.reached / sources.blocked.
#
# window_days: how far back (from "now") an item's own published/added date must
# fall to be considered "new" this run — independent of dedup (dedup additionally
# blocks anything already surfaced in a prior run, via state/seen.json).

tier1:
  - id: cisa_kev
    name: "CISA Known Exploited Vulnerabilities"
    type: cisa_kev
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    window_days: 7
    active: true
    checked: "2026-09-13"

  - id: nvd_critical
    name: "NVD — newly published CVEs, CVSS 9.0+"
    type: nvd_cve
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
    min_cvss: 9.0
    window_days: 7
    active: true
    checked: "2026-09-13"
    note: "Public NVD API. Unauthenticated rate limit is low (5 req/30s) — the workflow only calls this once per run."

