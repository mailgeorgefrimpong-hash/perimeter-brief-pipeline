tier3:
  - id: hn_signal
    name: "Hacker News — enterprise IT/security signal"
    type: hn_algolia
    url: "https://hn.algolia.com/api/v1/search_by_date"
    keywords:
      - "Microsoft 365"
      - "Entra"
      - "Conditional Access"
      - "ransomware"
      - "zero-day"
      - "CISA"
      - "enterprise security"
      - "Copilot"
    window_days: 7
    active: true
    checked: "2026-09-13"

  - id: stackexchange_signal
    name: "Stack Exchange — practitioner questions"
    type: stackexchange
    url: "https://api.stackexchange.com/2.3/questions"
    sites: ["serverfault", "security", "stackoverflow"]
    window_days: 7
    active: true
    checked: "2026-09-13"
    note: "Unauthenticated calls share a low daily quota across all callers of the API from the same IP — fine for one run/day, do not increase call frequency without a registered app key."

  - id: github_issues_signal
    name: "GitHub — public issue discussion"
    type: github_issues_search
    url: "https://api.github.com/search/issues"
    keywords:
      - "prompt injection"
      - "OAuth Entra"
      - "Conditional Access bypass"
    window_days: 7
    active: true
    checked: "2026-09-13"
    note: "Uses the workflow's GITHUB_TOKEN — the search API is heavily throttled without auth."

  # LinkedIn / Quora / Reddit have no reliable, official, unauthenticated read API
  # (Reddit's public .json endpoints frequently 403 from data-center IPs, exactly
  # as already logged in several past Ops runs). These three are intentionally left
  # OUT of the scripted pipeline rather than faked — if you want them covered, that
  # stays a small, occasional WebSearch job for the Claude step, not something to
  # script against a platform that doesn't offer a stable public API.
